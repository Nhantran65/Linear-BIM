name: s78
dataset: sleep-edf-78
variant: linear_bim
input_dim: 128
modalities: 4
classes: 5
dense_width: 64
protocol: author-compatible-s78
scope: author-full-tenfold / held-out-selected / leaky
frozen_outputs: artifacts/frozen/s78/frozen_outputs.npz
required_inputs:
  - data/s78/cache/manifest.json
training:
  allowed_stages: [head]
  backbone_optimizer:
    name: Adam
    lr: 0.001
    eps: 1.0e-7
    amsgrad: true
    scheduler: cosine_decay_restarts
    first_decay_steps: 10
  head_optimizer:
    name: Adam
    lr: 0.001
    eps: 1.0e-8
    amsgrad: false
seed: 32
