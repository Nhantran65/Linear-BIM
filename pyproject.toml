[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linear-bim"
version = "0.1.0"
description = "Standalone Linear-BIM and BIM-Explain research package"
requires-python = ">=3.10"
dependencies = ["numpy", "scikit-learn", "torch", "PyYAML"]

[project.optional-dependencies]
data = ["scipy", "mne", "pyedflib", "h5py"]
plot = ["matplotlib", "seaborn", "plotly"]
test = ["pytest"]

[project.scripts]
linear-bim = "linear_bim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
